<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yire Oil Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --red:#D21F26; --red-deep:#9E1218; --black:#000000; --paper:#FFFFFF;
  --concrete:#ECEAE5; --ink:#1A1D1C; --muted:#5B625F; --line:#D3D0C8;
  --ok:#0F7A4E; --bad:#B3261E; --slot:#FFFFFF; --slot-off:#F1EFEA;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#16201D; --concrete:#1E2A26; --ink:#EEF1EF; --muted:#A7B2AD; --line:#33433D;
  --slot:#22302B; --slot-off:#1A2420; --ok:#4FC28B; --bad:#FF8A80;
}}
:root[data-theme="dark"]{
  --paper:#16201D; --concrete:#1E2A26; --ink:#EEF1EF; --muted:#A7B2AD; --line:#33433D;
  --slot:#22302B; --slot-off:#1A2420; --ok:#4FC28B; --bad:#FF8A80;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth; scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0; background:var(--paper); color:var(--ink); font:400 17px/1.6 Barlow, "Helvetica Neue", Arial, sans-serif}
h1,h2,h3{font-family:"Barlow Condensed", "Arial Narrow", Arial, sans-serif; font-weight:800; line-height:1.05; margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--red); outline-offset:3px}
.wrap{max-width:1040px; margin:0 auto; padding:0 20px}

/* ---------- Header + hero ---------- */
.masthead{background:var(--black); color:#fff}
.topbar{display:flex; justify-content:space-between; align-items:center; gap:12px; padding-top:10px; padding-bottom:10px}
.logo{display:block; height:clamp(64px,9vw,96px); width:auto}
.lang{display:inline-flex; border:2px solid rgba(255,255,255,.85); border-radius:6px; overflow:hidden; flex:none}
.lang button{background:transparent; color:#fff; border:0; padding:8px 12px; font:600 15px/1 Barlow,sans-serif; cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--red); color:#fff}
.lang button:not([aria-pressed="true"]):hover{background:rgba(255,255,255,.14)}
.hero{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); background:var(--black); color:#fff; min-height:min(74vh,640px)}
.hero-copy{display:flex; flex-direction:column; justify-content:center; padding:clamp(28px,5vw,64px) clamp(20px,4vw,56px)}
.hero-photo{position:relative; min-height:320px}
.hero-photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:88% 62%}
.hero h1{font-size:clamp(42px,5.6vw,76px); max-width:12ch}
.hero p{max-width:34ch; font-size:clamp(16px,1.8vw,19px); margin:16px 0 26px; color:#e6e6e6}
.btn{display:inline-block; border:0; cursor:pointer; text-decoration:none; font:600 17px/1 Barlow,sans-serif;
  padding:15px 22px; border-radius:6px; background:var(--red); color:#fff}
.btn:hover{background:var(--red-deep)}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn.ghost{background:transparent; color:inherit; box-shadow:inset 0 0 0 2px currentColor}
/* the one bold thing: the red/white DOT reflective tape that runs along the tank */
.stripe{height:12px; background:repeating-linear-gradient(90deg,var(--red) 0 34px,#fff 34px 68px); border-block:3px solid var(--black)}

/* ---------- Mission ---------- */
.mission{padding:clamp(56px,9vw,104px) 0}
.mission-grid{display:grid; grid-template-columns:1.4fr 1fr; gap:clamp(28px,6vw,72px); align-items:start}
.mission h2{font-size:clamp(34px,5vw,54px); margin-bottom:18px}
.mission p{max-width:62ch; margin:0 0 14px}
.contact{background:var(--concrete); border-left:6px solid var(--red); padding:24px 26px; border-radius:0 8px 8px 0}
.contact h3{font-size:26px; margin-bottom:12px}
.contact dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:6px 16px}
.contact dt{color:var(--muted)}
.contact dd{margin:0; font-weight:600}
.contact dd a{text-decoration-color:var(--red); text-decoration-thickness:2px; text-underline-offset:3px}

/* ---------- Booking ---------- */
.book{background:var(--concrete); padding:clamp(56px,9vw,104px) 0}
.book h2{font-size:clamp(34px,5vw,54px)}
.book .lede{color:var(--muted); max-width:60ch; margin:10px 0 32px}
.step{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:clamp(18px,3vw,28px); margin-bottom:18px}
.step h3{font-size:24px; display:flex; gap:12px; align-items:baseline; margin-bottom:14px}
.step h3 .n{display:inline-grid; place-items:center; width:30px; height:30px; border-radius:50%; background:var(--ink); color:var(--paper); font-size:18px; flex:none}
.step.locked{opacity:.5; pointer-events:none}
.zip-row{display:flex; gap:10px; flex-wrap:wrap}
input,select,textarea{background:var(--paper); border:1.5px solid var(--line); border-radius:6px; padding:12px 14px; width:100%}
.zip-row input{max-width:180px; font-size:20px; letter-spacing:.08em}
.msg{margin-top:12px; font-weight:600}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}

.cal-wrap{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:24px}
.cal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px}
.cal-head strong{font:800 24px/1 "Barlow Condensed",sans-serif}
.cal-head button{background:none; border:1.5px solid var(--line); border-radius:6px; width:40px; height:40px; cursor:pointer}
.cal-head button[disabled]{opacity:.35; cursor:not-allowed}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.cal .dow{font-size:13px; color:var(--muted); text-align:center; padding:4px 0}
.day{aspect-ratio:1; border:1.5px solid var(--line); background:var(--slot); border-radius:6px; cursor:pointer; font-weight:600; display:grid; place-items:center; position:relative}
.day[disabled]{background:var(--slot-off); color:var(--muted); border-color:transparent; cursor:not-allowed; font-weight:400}
.day.sel{background:var(--red); color:#fff; border-color:var(--red)}
.day .dot{position:absolute; bottom:6px; width:5px; height:5px; border-radius:50%; background:var(--red)}
.day.sel .dot{background:#fff}
.times-title{font-weight:600; margin-bottom:8px}
.times{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:6px}
.time{padding:10px 4px; border:1.5px solid var(--line); background:var(--slot); border-radius:6px; cursor:pointer; font-weight:600}
.time.sel{background:var(--red); border-color:var(--red); color:#fff}
.empty{color:var(--muted)}

.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.form-grid .full{grid-column:1/-1}
label{display:block; font-weight:600; font-size:15px; margin-bottom:5px}
.summary{background:var(--concrete); border-radius:8px; padding:14px 16px; margin:4px 0 16px}
.summary b{font-weight:600}
.check{display:flex; gap:10px; align-items:flex-start; font-weight:400; font-size:16px}
.check input{width:20px; height:20px; margin-top:3px; flex:none}
.pay-row{display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-top:18px}
.fine{font-size:14px; color:var(--muted)}

.done{display:none; text-align:left}
.done.show{display:block}
.done h3{font-size:34px; margin-bottom:8px}

footer{background:var(--black); color:#cfcfcf; padding:28px 0; font-size:15px}

@media (max-width:760px){
  .mission-grid,.cal-wrap,.form-grid{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr; min-height:0}
  .hero-photo{order:-1; aspect-ratio:4/3; min-height:0}
}
</style>
</head>
<body>

<!-- =========================== HEADER / HERO =========================== -->
<header class="masthead">
  <div class="wrap topbar">
    <img class="logo" src="logo.jpg" alt="Yire Oil Service LLC" width="600" height="600">
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="es" lang="es">Español</button>
      <button type="button" data-lang="en" lang="en">English</button>
    </div>
  </div>
</header>
<div class="stripe" aria-hidden="true"></div>
<section class="hero">
  <div class="hero-copy">
    <h1 data-i18n="heroTitle"></h1>
    <p data-i18n="heroText"></p>
    <div><a class="btn" href="#book" data-i18n="heroCta"></a></div>
  </div>
  <div class="hero-photo"><img src="truck.jpg" data-i18n-alt="heroAlt" width="2000" height="1500"></div>
</section>

<!-- =========================== MISSION + CONTACT =========================== -->
<section class="mission" id="about">
  <div class="wrap mission-grid">
    <div>
      <h2 data-i18n="missionTitle"></h2>
      <p data-i18n="missionP1"></p>
      <p data-i18n="missionP2"></p>
    </div>
    <aside class="contact" aria-labelledby="contactTitle">
      <h3 id="contactTitle" data-i18n="contactTitle"></h3>
      <dl>
        <dt data-i18n="contactCall"></dt><dd><a id="phoneLink" href="#"></a></dd>
        <dt data-i18n="contactEmail"></dt><dd><a id="emailLink" href="#"></a></dd>
        <dt data-i18n="contactHours"></dt><dd id="hoursText"></dd>
        <dt data-i18n="contactArea"></dt><dd id="areaText"></dd>
        <dt>USDOT</dt><dd id="dotText"></dd>
      </dl>
    </aside>
  </div>
</section>

<!-- =========================== RESERVATIONS =========================== -->
<section class="book" id="book">
  <div class="wrap">
    <h2 data-i18n="bookTitle"></h2>
    <p class="lede" data-i18n="bookLede"></p>

    <div id="flow">
      <!-- Step 1: ZIP -->
      <div class="step" id="step1">
        <h3><span class="n">1</span><span data-i18n="step1"></span></h3>
        <form class="zip-row" id="zipForm" novalidate>
          <input id="zipInput" inputmode="numeric" maxlength="5" autocomplete="postal-code" placeholder="33182" data-i18n-aria="zipLabel">
          <button class="btn" type="submit" data-i18n="zipBtn"></button>
        </form>
        <div class="msg" id="zipMsg" role="status" aria-live="polite"></div>
      </div>

      <!-- Step 2: Date & time -->
      <div class="step locked" id="step2">
        <h3><span class="n">2</span><span data-i18n="step2"></span></h3>
        <div class="cal-wrap">
          <div>
            <div class="cal-head">
              <button type="button" id="prevMonth" data-i18n-aria="prevMonth">‹</button>
              <strong id="monthLabel"></strong>
              <button type="button" id="nextMonth" data-i18n-aria="nextMonth">›</button>
            </div>
            <div class="cal" id="cal"></div>
          </div>
          <div>
            <div class="times-title" id="timesTitle"></div>
            <div class="times" id="times"></div>
          </div>
        </div>
      </div>

      <!-- Step 3: Details + pay -->
      <div class="step locked" id="step3">
        <h3><span class="n">3</span><span data-i18n="step3"></span></h3>
        <div class="summary" id="summary"></div>
        <form id="detailsForm" novalidate>
          <div class="form-grid">
            <div><label for="fName" data-i18n="fName"></label><input id="fName" autocomplete="name" required></div>
            <div><label for="fPhone" data-i18n="fPhone"></label><input id="fPhone" type="tel" autocomplete="tel" required></div>
            <div class="full"><label for="fEmail" data-i18n="fEmail"></label><input id="fEmail" type="email" autocomplete="email" required></div>
            <div class="full"><label for="fAddress" data-i18n="fAddress"></label><input id="fAddress" autocomplete="street-address" required></div>
            <div><label for="fEquip" data-i18n="fEquip"></label>
              <!-- values stay in English so stored bookings are consistent -->
              <select id="fEquip">
                <option value="Dump truck" data-i18n="eqDump"></option>
                <option value="Semi / tractor-trailer" data-i18n="eqSemi"></option>
                <option value="RV / motorhome" data-i18n="eqRV"></option>
                <option value="Boat" data-i18n="eqBoat"></option>
                <option value="Other" data-i18n="eqOther"></option>
              </select></div>
            <div><label for="fGallons" data-i18n="fGallons"></label><input id="fGallons" type="number" inputmode="numeric" min="1" step="1" placeholder="100"></div>
            <div class="full"><label for="fVehicle" data-i18n="fVehicle"></label><input id="fVehicle" data-i18n-ph="fVehiclePh" required></div>
            <div class="full"><label for="fNotes" data-i18n="fNotes"></label><textarea id="fNotes" rows="3" data-i18n-ph="fNotesPh"></textarea></div>
            <label class="check full"><input type="checkbox" id="fAgree"> <span data-i18n="fAgree"></span></label>
          </div>
          <div class="pay-row">
            <button class="btn" type="submit" id="payBtn"></button>
            <span class="fine" id="payNote"></span>
          </div>
          <div class="msg bad" id="formMsg" role="alert"></div>
        </form>
      </div>
    </div>

    <div class="step done" id="done" role="status" aria-live="polite">
      <h3 id="doneTitle"></h3>
      <p id="doneText"></p>
      <button class="btn ghost" type="button" id="againBtn" data-i18n="againBtn"></button>
    </div>
  </div>
</section>

<footer><div class="wrap" id="footText"></div></footer>

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const toMin = hhmm => { const [h,m] = hhmm.split(":").map(Number); return h*60+m; };
const fmtTime = min => { let h=Math.floor(min/60), m=min%60, ap=h>=12?T().pm:T().am; h=h%12||12; return `${h}:${String(m).padStart(2,"0")} ${ap}`; };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fromYmd = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const fmtDateObj = d => d.toLocaleDateString(T().locale,{weekday:"long",month:"long",day:"numeric"});
const fmtDate = s => fmtDateObj(fromYmd(s));
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
function milesBetween(a,b,c,d){
  const R=3958.8, r=x=>x*Math.PI/180;
  const h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const ZIP_INDEX = Object.fromEntries(ZIPS.map(z=>[z[0], {lat:z[1], lng:z[2], city:z[3]}]));
const base = ZIP_INDEX[CONFIG.baseZip];
// Estimated drive minutes between two points {lat,lng}
function travelMin(a,b){
  const miles = milesBetween(a.lat,a.lng,b.lat,b.lng) * CONFIG.roadFactor;
  return Math.ceil((CONFIG.overheadMin + miles / CONFIG.avgMph * 60) / 5) * 5;
}
const locOf = b => (b.lat!=null ? {lat:b.lat, lng:b.lng} : (ZIP_INDEX[b.zip] || base));

  .then(r => r.ok && (r.headers.get("content-type") || "").includes("application/json"))
  .catch(() => false)
  .then(ok => { API = !!ok; renderPayNote(); return API; });

async function loadAvail(zip){
  const r = await fetch("/api/availability?zip=" + encodeURIComponent(zip), { headers: { accept: "application/json" } });
  if (r.status === 400) return null;                 // out of area
  if (!r.ok) throw new Error("availability " + r.status);
  const data = await r.json();
  state.avail = data.days || {};
  return data;
}

  else { bookings.push(b); saveLocal(); }

/* ---------- availability ----------
   A start time S at location L works if, for every booking B that day:
     B before S:  B.start + service + drive(B -> L) <= S
     B after S:   S + service + drive(L -> B) <= B.start
   so the truck can finish each stop, get ready, and drive to the next one.
   Straight-line distances obey the triangle inequality, so checking every
   booking is the same as checking the one before and the one after. */
function openSlots(date, loc){
  if(!loc) return [];
  if(API) return (state.avail && state.avail[date]) || [];
  const day = bookings.filter(b=>b.date===date && b.status!=="cancelled");
  const now = new Date();
  const isToday = date===ymd(now);
  const nowMin = now.getHours()*60+now.getMinutes();
  const earliestFromBase = CONFIG.departBaseAt ? toMin(CONFIG.departBaseAt) + travelMin(base, loc) : 0;
  const out=[];
  for(let s=toMin(CONFIG.firstStart); s<=toMin(CONFIG.lastStart); s+=CONFIG.slotStepMin){
    if(isToday && s < nowMin+CONFIG.minLeadMin) continue;
    if(s < earliestFromBase) continue;
    const fits = day.every(b=>{
      const bl = locOf(b);
      return b.start <= s
        ? b.start + CONFIG.serviceMin + travelMin(bl, loc) <= s
        : s + CONFIG.serviceMin + travelMin(loc, bl) <= b.start;
    });
    if(fits) out.push(s);
  }
  return out;
}
function dayBookable(d){
  const today=new Date(); today.setHours(0,0,0,0);
  const last=new Date(today); last.setDate(last.getDate()+CONFIG.bookAheadDays);
  if(d<today||d>last) return false;
  if(!CONFIG.openDays.includes(d.getDay())) return false;
  return openSlots(ymd(d), state.loc).length>0;
}

/* First day with open times. Before a ZIP is entered there's no location,
   so it only checks open weekdays and whether today's hours have passed. */
function firstOpenDate(loc){
  const d=new Date(); d.setHours(0,0,0,0);
  for(let i=0;i<=CONFIG.bookAheadDays;i++, d.setDate(d.getDate()+1)){
    if(!CONFIG.openDays.includes(d.getDay())) continue;
    if(loc){ if(openSlots(ymd(d), loc).length) return new Date(d); }
    else if(openSlots(ymd(d), base).length) return new Date(d);
  }
  return new Date();
}
const monthStart = d => new Date(d.getFullYear(), d.getMonth(), 1);

/* ---------- step 1: ZIP ---------- */
function setZipMsg(ok, key, args){
  state.zipResult = {ok, key, args};
  const msg=$("zipMsg");
  msg.className = "msg " + (ok?"ok":"bad");
  msg.textContent = tx(key, ...args);
}
$("zipForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const zip = $("zipInput").value.trim();
  if(!/^\d{5}$/.test(zip)){ setZipMsg(false,"zipInvalid",[]); return lockFrom(2); }
  const hit = ZIP_INDEX[zip];
  if(!hit){
    setZipMsg(false,"zipOut",[zip, CONFIG.phone]);
    return lockFrom(2);
  }
  if(await apiReady){
    try{
      if(!(await loadAvail(zip))){ setZipMsg(false,"zipOut",[zip, CONFIG.phone]); return lockFrom(2); }
    }catch(err){ setZipMsg(false,"errNetwork",[CONFIG.phone]); return lockFrom(2); }
  }
  state.zip=zip; state.loc={lat:hit.lat, lng:hit.lng};
  state.date=null; state.start=null;
  state.month = monthStart(firstOpenDate(state.loc));   // jump to the first month this ZIP can book
  setZipMsg(true,"zipOk",[zip, hit.city]);
  renderTimes();
  $("step2").classList.remove("locked");
  renderCalendar();
});
$("zipInput").addEventListener("input", e=>{ e.target.value=e.target.value.replace(/\D/g,"").slice(0,5); });

function lockFrom(n){
  if(n<=2){ $("step2").classList.add("locked"); state.zip=null; state.loc=null; }
  if(n<=3){ $("step3").classList.add("locked"); }
}

/* ---------- step 2: calendar ---------- */
function renderCalendar(){
  const cal=$("cal"); cal.innerHTML="";
  const m=state.month;
  $("monthLabel").textContent = cap(m.toLocaleDateString(T().locale,{month:"long",year:"numeric"}));
  T().days.forEach(n=>{ const el=document.createElement("div"); el.className="dow"; el.textContent=n; cal.appendChild(el); });
  for(let i=0;i<m.getDay();i++) cal.appendChild(document.createElement("div"));
  const days=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
  for(let d=1; d<=days; d++){
    const date=new Date(m.getFullYear(),m.getMonth(),d);
    const key=ymd(date);
    const b=document.createElement("button");
    b.type="button"; b.className="day"; b.textContent=d;
    const ok=dayBookable(date);
    b.disabled=!ok;
    b.setAttribute("aria-label", fmtDateObj(date) + (ok?"":T().unavailable));
    if(ok){ const dot=document.createElement("span"); dot.className="dot"; b.appendChild(dot); }
    if(state.date===key){ b.classList.add("sel"); b.setAttribute("aria-pressed","true"); }
    b.addEventListener("click",()=>{
      state.date=key; state.start=null; $("step3").classList.add("locked"); renderCalendar(); renderTimes();
      if(API) loadAvail(state.zip).then(()=>{ renderCalendar(); renderTimes(); }).catch(()=>{});
    });
    cal.appendChild(b);
  }
  const now=new Date();
  $("prevMonth").disabled = m.getFullYear()===now.getFullYear() && m.getMonth()===now.getMonth();
  const lastDay=new Date(); lastDay.setDate(lastDay.getDate()+CONFIG.bookAheadDays);
  $("nextMonth").disabled = new Date(m.getFullYear(),m.getMonth()+1,1)>lastDay;
}
$("prevMonth").onclick=()=>{ state.month=new Date(state.month.getFullYear(),state.month.getMonth()-1,1); renderCalendar(); };
$("nextMonth").onclick=()=>{ state.month=new Date(state.month.getFullYear(),state.month.getMonth()+1,1); renderCalendar(); };

function renderTimes(){
  const box=$("times"); box.innerHTML="";
  if(!state.date){ $("timesTitle").textContent=T().pickDay; return; }
  const slots=openSlots(state.date, state.loc);
  $("timesTitle").textContent = cap(fmtDate(state.date));
  if(!slots.length){ const p=document.createElement("p"); p.className="empty"; p.textContent=T().dayFull; box.appendChild(p); return; }
  if(state.start!==null && !slots.includes(state.start)){ state.start=null; $("step3").classList.add("locked"); }
  slots.forEach(s=>{
    const b=document.createElement("button");
    b.type="button"; b.className="time"+(state.start===s?" sel":""); b.textContent=fmtTime(s);
    b.setAttribute("aria-pressed", state.start===s);
    b.addEventListener("click",()=>{ state.start=s; renderTimes(); openDetails(); });
    box.appendChild(b);
  });
}

/* ---------- step 3: details ---------- */
function openDetails(){
  $("summary").innerHTML = tx("summary", fmtDate(state.date), fmtTime(state.start), state.zip);
  $("step3").classList.remove("locked");
  $("step3").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"start"});
}

$("detailsForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const f = id=>$(id).value.trim();
  const msg=$("formMsg"); msg.textContent="";
  if(!f("fName")||!f("fPhone")||!f("fAddress")||!f("fVehicle")) { msg.textContent=T().errFields; return; }
  if(!/^\S+@\S+\.\S+$/.test(f("fEmail"))) { msg.textContent=T().errEmail; return; }
  if(!$("fAgree").checked) { msg.textContent=tx("errAgree", CONFIG.depositUSD); return; }
  if(!openSlots(state.date, state.loc).includes(state.start)) { msg.textContent=T().errTaken; renderTimes(); return; }

  const btn=$("payBtn"); btn.disabled=true; btn.textContent=T().processing;
  const resetBtn = () => { btn.disabled=false; btn.textContent=tx("payBtn", CONFIG.depositUSD); };

  /* ---- Live: the server holds the slot and returns a Square checkout link.
     The booking is only confirmed when Square's webhook says the $5 was paid. ---- */
  if(API){
    try{
      const r = await fetch("/api/checkout", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          date: state.date, start: state.start, zip: state.zip,
          name: f("fName"), phone: f("fPhone"), email: f("fEmail"), address: f("fAddress"),
          equipment: $("fEquip").value, gallons: Number(f("fGallons")) || null,
          details: f("fVehicle"), notes: f("fNotes"), lang
        })
      });
      const data = await r.json().catch(()=>({}));
      if(r.ok && data.url){ window.location.href = data.url; return; }   // off to Square
      if(r.status === 409){
        msg.textContent = T().errTaken;
        await loadAvail(state.zip).catch(()=>{});
        renderCalendar(); renderTimes();
      } else if(data.error === "missing_fields"){ msg.textContent = T().errFields; }
      else { msg.textContent = tx("errPay", CONFIG.phone); }
    }catch(err){ msg.textContent = tx("errPay", CONFIG.phone); }
    resetBtn();
    return;
  }

  /* ---- Demo mode: record the booking locally, no payment. ---- */
  const booking = {
    id: `${state.date}_${String(state.start).padStart(4,"0")}`,
    date: state.date, start: state.start, zip: state.zip, lat: state.loc.lat, lng: state.loc.lng,
    status: "confirmed",
    name: f("fName"), phone: f("fPhone"), email: f("fEmail"),
    address: f("fAddress"), equipment: $("fEquip").value, gallons: Number(f("fGallons"))||null,
    details: f("fVehicle"), fuel: "Diesel",
    notes: f("fNotes"), lang, deposit: CONFIG.depositUSD, paid: "demo", createdAt: Date.now()
  };
  try{
    await saveBooking(booking);
    state.lastBooking = booking;
    $("flow").style.display="none";
    $("done").classList.add("show");
    $("doneText").textContent = tx("doneText", booking.name.split(" ")[0], fmtDate(booking.date), fmtTime(booking.start), booking.phone);
    $("done").scrollIntoView({block:"start"});
  }catch(err){
    msg.textContent=tx("errSave", CONFIG.phone);
  }finally{
    btn.disabled=false; btn.textContent=tx("payBtn", CONFIG.depositUSD);
  }
});

/* ---------- back from Square: ?booking=<id> ---------- */
function renderReturn(){
  const r = state.returned; if(!r) return;
  const title = $("doneTitle"), text = $("doneText");
  if(r.status === "confirmed"){
    title.textContent = T().doneTitle;
    text.textContent = tx("doneTextLive", r.firstName, fmtDate(r.date), fmtTime(r.start));
  } else if(r.status === "conflict"){
    title.textContent = T().conflictTitle; text.textContent = tx("conflictText", CONFIG.phone);
  } else if(r.status === "expired" || r.status === "cancelled"){
    title.textContent = T().expiredTitle; text.textContent = T().expiredText;
  } else if(r.gaveUp){
    title.textContent = T().pendingTitle; text.textContent = tx("pendingText", CONFIG.phone);
  } else {
    title.textContent = T().confirmingTitle; text.textContent = T().confirmingText;
  }
}
async function handleReturn(id){
  $("flow").style.display="none";
  $("done").classList.add("show");
  state.returned = { status: "pending" };
  renderReturn();
  $("book").scrollIntoView({block:"start"});
  for(let i=0; i<20; i++){                       // Square's webhook usually lands within a few seconds
    try{
      const r = await fetch("/api/booking/" + encodeURIComponent(id), { headers: { accept: "application/json" } });
      if(r.ok){
        const data = await r.json();
        state.returned = data; renderReturn();
        if(data.status !== "pending") return;
      }
    }catch(e){}
    await new Promise(res => setTimeout(res, 2000));
  }
  state.returned = { ...state.returned, gaveUp: true }; renderReturn();
}

$("againBtn").addEventListener("click",()=>{
  if(state.returned){ state.returned=null; history.replaceState(null, "", location.pathname); }
  $("doneTitle").textContent = T().doneTitle;
  $("detailsForm").reset(); state.start=null; state.date=null; state.lastBooking=null;
  $("done").classList.remove("show"); $("flow").style.display="";
  $("step3").classList.add("locked"); renderCalendar(); renderTimes();
  $("book").scrollIntoView({block:"start"});
});

state.month = monthStart(firstOpenDate(null));
applyLang();
const returnId = new URLSearchParams(location.search).get("booking");
if(returnId && /^[0-9a-f-]{36}$/.test(returnId)) apiReady.then(live => { if(live) handleReturn(returnId); });
</script>
</body>
